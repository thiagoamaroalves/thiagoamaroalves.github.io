<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">A escolha de arquitetura começa pelo objetivo</title>
  <desc id="desc">O fluxo parte da necessidade do negócio, define o que otimizar, compara trade-offs e escolhe uma arquitetura para alcançar um resultado de negócio. Popularidade e novidade influenciam as opções consideradas.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1F3A5F" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
    <marker id="arrow-to-box" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#FAF8F4"/>
  <rect width="1200" height="700" fill="url(#grid)"/>

  <text x="60" y="58" fill="#161616" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">A arquitetura começa pelo objetivo</text>
  <text x="60" y="92" fill="#5A5A57" font-family="Inter, Arial, sans-serif" font-size="19">Parta da necessidade do negócio e defina o que vale otimizar.</text>

  <rect x="248" y="126" width="330" height="82" fill="#F2EFE8" stroke="#D8D2C8" stroke-width="2"/>
  <text x="272" y="153" fill="#1F3A5F" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="600">POPULARIDADE</text>
  <text x="272" y="184" fill="#161616" font-family="Inter, Arial, sans-serif" font-size="19">Mais profissionais disponíveis</text>

  <rect x="622" y="126" width="330" height="82" fill="#E9E2D6" stroke="#D8D2C8" stroke-width="2"/>
  <text x="646" y="153" fill="#1F3A5F" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="600">NOVIDADE</text>
  <text x="646" y="184" fill="#161616" font-family="Inter, Arial, sans-serif" font-size="19">Tecnologia nova ou moderna</text>

  <path d="M 413 208 V 247 L 705 286" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <path d="M 787 208 V 286" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <rect x="45" y="295" width="225" height="190" fill="#F2EFE8" stroke="#D8D2C8" stroke-width="2"/>
  <text x="68" y="330" fill="#1F3A5F" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="600">NECESSIDADE</text>
  <text x="68" y="372" fill="#161616" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">
    <tspan x="68" dy="0">Problema de</tspan>
    <tspan x="68" dy="27">negócio</tspan>
  </text>
  <text x="68" y="442" fill="#5A5A57" font-family="Inter, Arial, sans-serif" font-size="16">
    <tspan x="68" dy="0">Qual resultado</tspan>
    <tspan x="68" dy="22">precisa melhorar?</tspan>
  </text>

  <path d="M 270 390 H 308" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="315" y="295" width="230" height="190" fill="#E7EDF5" stroke="#D8D2C8" stroke-width="2"/>
  <text x="339" y="330" fill="#1F3A5F" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="600">OBJETIVO</text>
  <text x="339" y="372" fill="#161616" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">
    <tspan x="339" dy="0">O que estamos</tspan>
    <tspan x="339" dy="29">otimizando?</tspan>
  </text>
  <text x="339" y="445" fill="#5A5A57" font-family="Inter, Arial, sans-serif" font-size="15">Critério para comparar opções</text>

  <path d="M 545 390 H 583" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="590" y="295" width="270" height="190" fill="#FFFDF9" stroke="#D8D2C8" stroke-width="2"/>
  <text x="614" y="330" fill="#1F3A5F" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="600">TRADE-OFFS AVALIADOS</text>
  <rect x="612" y="347" width="226" height="34" fill="#E7EDF5" stroke="#D8D2C8" stroke-width="1"/>
  <text x="628" y="370" fill="#161616" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Adequação ao problema</text>
  <rect x="612" y="388" width="226" height="34" fill="#F2EFE8" stroke="#D8D2C8" stroke-width="1"/>
  <text x="628" y="411" fill="#161616" font-family="Inter, Arial, sans-serif" font-size="16">Complexidade operacional</text>
  <rect x="612" y="429" width="226" height="34" fill="#F2EFE8" stroke="#D8D2C8" stroke-width="1"/>
  <text x="628" y="452" fill="#161616" font-family="Inter, Arial, sans-serif" font-size="16">Profissionais disponíveis</text>

  <path d="M 860 390 H 898" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="905" y="295" width="250" height="190" fill="#E7EDF5" stroke="#D8D2C8" stroke-width="2"/>
  <text x="929" y="330" fill="#1F3A5F" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="600">ARQUITETURA</text>
  <text x="929" y="372" fill="#161616" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">
    <tspan x="929" dy="0">Escolha adequada</tspan>
    <tspan x="929" dy="28">ao objetivo</tspan>
  </text>
  <text x="929" y="445" fill="#5A5A57" font-family="Inter, Arial, sans-serif" font-size="16">Feita para este problema</text>

  <path d="M 1030 485 V 551" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow-to-box)"/>
  <rect x="905" y="552" width="250" height="78" fill="#E9E2D6" stroke="#D8D2C8" stroke-width="2"/>
  <text x="1030" y="590" text-anchor="middle" fill="#161616" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">
    <tspan x="1030" dy="0">Resultado melhor</tspan>
    <tspan x="1030" dy="23">para o negócio</tspan>
  </text>
</svg>
